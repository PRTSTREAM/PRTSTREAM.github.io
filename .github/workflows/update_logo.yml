name: Process Image & Commit
on:
  workflow_dispatch:
    inputs:
      IMAGE_URL:
        description: 'Image URL to process'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Run Processing Script
        run: |
          cat << 'EOF' > process.py
          import os
          import requests
          from PIL import Image
          from io import BytesIO
          import json
          import base64

          REPO_OWNER = os.getenv("GITHUB_REPOSITORY_OWNER")
          REPO_NAME = os.getenv("GITHUB_REPOSITORY").split("/")[-1]
          GITHUB_TOKEN = os.getenv("PAT")

          def make_square_and_encoded(img_url):
              try:
                  response = requests.get(img_url, timeout=10)
                  if response.status_code != 200:
                      return None
                  img = Image.open(BytesIO(response.content)).convert("RGBA")
                  width, height = img.size
                  max_side = max(width, height)
                  new_img = Image.new("RGBA", (max_side, max_side), (255, 255, 255, 0))
                  offset = ((max_side - width) // 2, (max_side - height) // 2)
                  new_img.paste(img, offset)
                  new_img = new_img.resize((300, 300), Image.Resampling.LANCZOS)
                  output = BytesIO()
                  new_img.convert("RGB").save(output, format="JPEG", quality=90)
                  return base64.b64encode(output.getvalue()).decode('utf-8')
              except Exception as e:
                  print(f"Error: {e}")
                  return None

          def commit_to_github(filename, image_data):
              url = f"https://api.github.com/repos/{REPO_OWNER}/{REPO_NAME}/contents/logos/{filename}"
              headers = {
                  "Authorization": f"token {GITHUB_TOKEN}",
                  "Content-Type": "application/json"
              }
              data = {
                  "message": f"Add processed square logo {filename}",
                  "content": image_data,
                  "branch": "main"
              }
              response = requests.get(url, headers={"Authorization": f"token {GITHUB_TOKEN}"})
              if response.status_code == 200:
                  data["sha"] = response.json()["sha"]
              put_response = requests.put(url, headers=headers, data=json.dumps(data))
              return put_response.status_code in [201, 200]

          IMAGE_URL = "${{ github.event.inputs.IMAGE_URL }}"
          if IMAGE_URL:
              encoded_image = make_square_and_encoded(IMAGE_URL)
              if encoded_image:
                  filename = "logo.jpg"
                  commit_to_github(filename, encoded_image)
          EOF
          python process.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PAT: ${{ secrets.PAT }}
