  <script>
    function isDesktop() {
      return !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
    }

    window.addEventListener("DOMContentLoaded", function() {
      if (isDesktop()) {
        var container = document.getElementById("mediaContainer");
        container.innerHTML = '<iframe class="embed-player" src="https://prtstream.github.io/embed.html?url=https%3A%2F%2Famg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv%2Fplaylist%2Famg01269-willowtvfast-willowplus-sportstribalemea%2Fplaylist.m3u8" allowfullscreen="true" frameborder="0"></iframe>';
      }
    });

    function handlePlayClick() {
      if (isDesktop()) {
        var container = document.getElementById("mediaContainer");
        container.innerHTML = '<iframe class="embed-player" src="https://prtstream.github.io/embed.html?url=https%3A%2F%2Famg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv%2Fplaylist%2Famg01269-willowtvfast-willowplus-sportstribalemea%2Fplaylist.m3u8" allowfullscreen="true" frameborder="0"></iframe>';
      } else {
        playInMobileApp();
      }
    }

    /* WhatsApp Direct Share Function */
    function shareOnWhatsApp() {
      var message = "Is website aap daily cricket live matches dekh sakte free me: " + window.location.href;
      var whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);
      window.open(whatsappUrl, '_blank');
    }

    var appCheckTimer = null;
    var isAppOpened = false;

    function playInMobileApp() {
      var streamUrl = "https://amg01269-amg01269c1-sportstribal-emea-5204.playouts.now.amagi.tv/playlist/amg01269-willowtvfast-willowplus-sportstribalemea/playlist.m3u8";
      var customSchemeUrl = "prtstream://play?url=" + encodeURIComponent(streamUrl);

      isAppOpened = false;

      var handleVisibilityChange = function() {
        if (document.hidden) {
          isAppOpened = true;
        }
      };

      document.addEventListener("visibilitychange", handleVisibilityChange);

      window.location.href = customSchemeUrl;

      if (appCheckTimer) clearTimeout(appCheckTimer);

      appCheckTimer = setTimeout(function() {
        document.removeEventListener("visibilitychange", handleVisibilityChange);
        if (!isAppOpened && !document.hidden) {
          showToast("Aapke paas PRT STREAM App install nahi he!");
          document.getElementById("installBtn").style.display = "flex";
        }
      }, 1800);
    }

    function showToast(message) {
      var toast = document.getElementById("toast");
      toast.innerText = message;
      toast.classList.add("show");
      setTimeout(function() {
        toast.classList.remove("show");
      }, 4000);
    }
  </script>
