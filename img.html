<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Image Resizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #2a2a2a;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #f39c12; }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #333;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #e67e22;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { background: #666; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; }
        #result { margin-top: 15px; }
        img.preview {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Instant Image Resizer</h2>
    <input type="url" id="imgUrl" placeholder="यहाँ इमेज का URL डालें..." required>
    <button id="submitBtn" onclick="processImage()">Process Image</button>

    <div id="status"></div>
    <div id="result"></div>
</div>

<script>
    async function processImage() {
        const urlInput = document.getElementById('imgUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const btn = document.getElementById('submitBtn');

        if (!urlInput) {
            alert("कृपया सही इमेज URL डालें!");
            return;
        }

        btn.disabled = true;
        statusDiv.style.color = "#f39c12";
        statusDiv.innerText = "इमेज लोड हो रही है...";
        resultDiv.innerHTML = "";

        try {
            // CORS bypass के लिए proxy या सीधे लोड करने की कोशिश
            const img = new Image();
            img.crossOrigin = "anonymous";
            
            img.onload = function() {
                // Canvas बनाकर 300x300 स्क्वायर में कन्वर्ट करना
                const canvas = document.createElement('canvas');
                canvas.width = 300;
                canvas.height = 300;
                const ctx = canvas.getContext('2d');

                // सफेद बैकग्राउंड भरना (Transparency बचाने के लिए)
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, 300, 300);

                // सेंटर में इमेज को फिट करना (Square Crop/Pad)
                let size = Math.max(img.width, img.height);
                let x = (size - img.width) / 2;
                let y = (size - img.height) / 2;

                // अस्थायी बड़ा कैनवास ताकि इमेज distorted न हो
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = size;
                tempCanvas.height = size;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.fillStyle = "#FFFFFF";
                tempCtx.fillRect(0, 0, size, size);
                tempCtx.drawImage(img, x, y);

                // अब 300x300 में रीसाइज करना
                ctx.drawImage(tempCanvas, 0, 0, size, size, 0, 0, 300, 300);

                // Data URL निकालना
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

                statusDiv.style.color = "#2ecc71";
                statusDiv.innerText = "इमेज सफलतापूर्वक 300x300 की बन गई है!";
                
                resultDiv.innerHTML = `
                    <p style="color:#2ecc71; font-size:14px;">नीचे प्रीव्यू देखें और डाउनलोड करें:</p>
                    <img src="${dataUrl}" class="preview" alt="Processed Image"><br><br>
                    <a href="${dataUrl}" download="logo.jpg" style="background:#2ecc71; color:#000; padding:10px 20px; text-decoration:none; font-weight:bold; border-radius:5px; display:inline-block;">Download Image</a>
                `;
                btn.disabled = false;
            };

            img.onerror = function() {
                // अगर CORS की वजह से इमेज लोड न हो, तो प्रॉक्सी का इस्तेमाल करें
                img.src = "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlInput);
            };

            // पहली बार डायरेक्ट लोड करना
            img.src = urlInput;

        } catch (err) {
            statusDiv.style.color = "#e74c3c";
            statusDiv.innerText = "एरर: " + err.message;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
