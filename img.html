<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Square Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #2a2a2a;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #f39c12; }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #333;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #e67e22;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { background: #666; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; }
        #result { margin-top: 15px; word-break: break-all; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Image Square Converter</h2>
    <input type="url" id="imgUrl" placeholder="यहाँ इमेज का URL डालें..." required>
    <button id="submitBtn" onclick="processImage()">Submit & Process</button>

    <div id="status"></div>
    <div id="result"></div>
</div>

<script>
    // Configuration Settings
    const GITHUB_USERNAME = "PRTSTREAM"; // आपका GitHub Username
    const REPO_NAME = "PRTSTREAM.github.io"; // आपकी Repository का नाम
    const PAT_TOKEN = "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"; // यहाँ अपना GitHub PAT टोकन डालें
    const WORKFLOW_ID = "update_logo.yml"; // Workflow फ़ाइल का नाम

    async function processImage() {
        const urlInput = document.getElementById('imgUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const btn = document.getElementById('submitBtn');

        if (!urlInput) {
            alert("कृपया सही इमेज URL डालें!");
            return;
        }

        btn.disabled = true;
        statusDiv.style.color = "#f39c12";
        statusDiv.innerText = "GitHub Action ट्रिगर हो रहा है...";
        resultDiv.innerText = "";

        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                method: "POST",
                headers: {
                    "Authorization": `token ${PAT_TOKEN}`,
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    ref: "main",
                    inputs: {
                        IMAGE_URL: urlInput
                    }
                })
            });

            if (response.ok || response.status === 204) {
                let timeLeft = 25; // 25 सेकंड का टाइमर
                statusDiv.innerText = `प्रोसेसिंग शुरू हो गई है... कृपया इंतज़ार करें: ${timeLeft}s`;

                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        statusDiv.innerText = `प्रोसेसिंग जारी है... कृपया इंतज़ार करें: ${timeLeft}s`;
                    } else {
                        clearInterval(timer);
                        statusDiv.style.color = "#2ecc71";
                        statusDiv.innerText = "प्रोसेसिंग पूर्ण!";
                        
                        const finalUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/logos/logo.jpg`;
                        resultDiv.innerHTML = `
                            <p style="color:#2ecc71;">आपकी इमेज तैयार और सेव हो चुकी है!</p>
                            <a href="${finalUrl}" target="_blank">${finalUrl}</a>
                        `;
                        btn.disabled = false;
                    }
                }, 1000);

            } else {
                const errData = await response.json();
                statusDiv.style.color = "#e74c3c";
                statusDiv.innerText = "एरर: " + (errData.message || "वर्कफ़्लो ट्रिगर नहीं हो सका।");
                btn.disabled = false;
            }
        } catch (err) {
            statusDiv.style.color = "#e74c3c";
            statusDiv.innerText = "नेटवर्क एरर: " + err.message;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
