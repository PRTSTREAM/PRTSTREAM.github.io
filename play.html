<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRT STREAM Player</title>
  
  <!-- Plyr & HLS.js CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100vh; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
    
    .player-container { 
      position: relative; 
      width: 100%; 
      max-width: 100%;
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #000; 
    }

    .plyr-wrapper {
      width: 100%;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plyr {
      width: 100%;
      height: 100%;
      max-height: 100vh;
    }
    
    /* PRT STREAM Logo Styling (Always on top in Fullscreen) */
    .watermark-logo {
      position: absolute !important;
      top: 15px !important;
      left: 15px !important;
      z-index: 999999 !important;
      font-family: sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      text-shadow: 1px 1px 2px #000;
    }
    .watermark-logo .prt { color: #ff0000; }
    .watermark-logo .stream { color: #ffcc00; }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="plyr-wrapper">
      <video id="player" controls playsinline></video>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById('player');
      const streamUrl = "https://akamaii.lovable.app/api/public/px/sony?url=https://dishmt.slivcdn.com/hls/live/2020591/TEN3HD/master.m3u8?hdnea=exp=1792856138~acl=/*~id=56802292105135609014021090190347~hmac=a39a9910e509ce592304edd5bec2e84d72bc66cd13b5e3e234ddcfedbc96d082";

      // Dynamic Watermark Element
      function addWatermark(plyrContainer) {
        if (!plyrContainer.querySelector('.watermark-logo')) {
          const logoDiv = document.createElement('div');
          logoDiv.className = 'watermark-logo';
          logoDiv.innerHTML = '<span class="prt">PRT</span> <span class="stream">STREAM</span>';
          plyrContainer.appendChild(logoDiv);
        }
      }

      if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
        const hls = new Hls({ maxMaxBufferLength: 100 });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          const availableLevels = hls.levels.map((l) => l.height).filter(Boolean);
          const defaultQuality = availableLevels.length ? availableLevels[0] : 0;

          const player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'quality', 'settings', 'fullscreen'],
            quality: {
              default: defaultQuality,
              options: availableLevels,
              forced: true,
              onChange: (newQuality) => {
                hls.levels.forEach((level, index) => {
                  if (level.height === newQuality) {
                    hls.currentLevel = index;
                  }
                });
              }
            }
          });

          // Logo inject in plyr container
          const plyrElement = document.querySelector('.plyr');
          if (plyrElement) addWatermark(plyrElement);

          video.play().catch(() => { 
            video.muted = true; 
            video.play(); 
          });
        });
      } else {
        video.src = streamUrl;
        const player = new Plyr(video, { controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'] });
        
        const plyrElement = document.querySelector('.plyr');
        if (plyrElement) addWatermark(plyrElement);

        video.play().catch(() => { 
          video.muted = true; 
          video.play(); 
        });
      }
    });
  </script>
</body>
</html>
