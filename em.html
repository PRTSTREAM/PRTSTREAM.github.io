<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRT STREAM Player</title>
  
  <!-- Plyr & HLS.js CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100vh; background: #000; color: #fff; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; }
    
    .player-container { 
      position: relative; 
      width: 100%; 
      max-width: 100%;
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #000; 
    }

    .plyr-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plyr {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      --plyr-color-main: #ffcc00; 
      --plyr-video-control-color: #ff1493; 
      --plyr-video-control-color-hover: #ffcc00; 
      --plyr-video-control-background-hover: rgba(255, 20, 147, 0.25);
    }

    /* Keep Plyr Controls Visible Above Ads */
    .plyr__controls {
      z-index: 2147483647 !important;
    }

    video.fit-contain { object-fit: contain !important; }
    video.fit-cover { object-fit: cover !important; }
    video.fit-fill { object-fit: fill !important; }

    .plyr__progress__container input[type=range]::-webkit-slider-thumb {
      background: #ff1493 !important;
      box-shadow: 0 0 10px #ff1493 !important;
    }
    
    .plyr__control--overlaid {
      background: rgba(255, 20, 147, 0.85) !important;
    }
    .plyr__control--overlaid:hover {
      background: #ff1493 !important;
    }
    
    /* PRT STREAM Watermark Logo */
    .watermark-logo {
      position: absolute !important;
      top: 15px !important;
      left: 15px !important;
      z-index: 2147483646 !important;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      text-shadow: 1px 1px 2px #000;
    }
    .watermark-logo .prt { color: #ff0000; }
    .watermark-logo .stream { color: #ffcc00; }

    /* Action Buttons Group */
    .action-btn-group {
      position: absolute !important;
      top: 15px !important;
      right: 15px !important;
      z-index: 2147483646 !important;
      display: flex;
      gap: 8px;
    }

    .prt-open-btn {
      background: rgba(255, 20, 147, 0.85);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ffcc00;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .prt-open-btn:hover {
      background: #ff1493;
      color: #ffcc00;
      transform: scale(1.05);
    }

    .install-app-btn {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ffffff;
      display: none;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .install-app-btn:hover {
      transform: scale(1.05);
    }

    .plyr__controls .zoom-btn {
      background: transparent;
      border: none;
      color: #ff1493;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      padding: 0 6px;
    }
    .plyr__controls .zoom-btn:hover {
      color: #ffcc00;
    }

    /* Toast Notification Styling */
    .toast {
      visibility: hidden;
      min-width: 260px;
      background-color: #ff3333;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 12px;
      position: fixed;
      z-index: 2147483647;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      transition: visibility 0.4s, opacity 0.4s ease-in-out;
      opacity: 0;
    }
    .toast.show {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="player-container" id="playerContainer">
    <div class="plyr-wrapper">
      <video id="player" controls playsinline class="fit-contain"></video>
    </div>
  </div>

  <!-- Toast Message Popup -->
  <div id="toast" class="toast">Aapke paas PRT STREAM App install nahi he!</div>

  <script>
    const streamUrl = "https://vk10.lovable.app/api/public/proxy?u=https%3A%2F%2Fallinonereborn2.online%2Fsony-new%2Fplaylists%2Fsony_ten3_hd.m3u8";

    function isDesktop() {
      return !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
    }

    var appCheckTimer = null;
    var isAppOpened = false;

    function handleAppRedirect() {
      if (isDesktop()) {
        window.open('https://prtstream.xyz', '_blank');
      } else {
        var customSchemeUrl = "prtstream://play?url=" + encodeURIComponent(streamUrl);
        isAppOpened = false;

        var handleVisibilityChange = function() {
          if (document.hidden) {
            isAppOpened = true;
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.location.href = customSchemeUrl;

        if (appCheckTimer) clearTimeout(appCheckTimer);

        appCheckTimer = setTimeout(function() {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          if (!isAppOpened && !document.hidden) {
            showToast("Aapke paas PRT STREAM App install nahi he!");
            
            const openBtn = document.getElementById("prtOpenBtn");
            const installBtn = document.getElementById("installAppBtn");
            if (openBtn) openBtn.style.display = "none";
            if (installBtn) installBtn.style.display = "flex";
          }
        }, 1800);
      }
    }

    function showToast(message) {
      var toast = document.getElementById("toast");
      toast.innerText = message;
      toast.classList.add("show");
      setTimeout(function() {
        toast.classList.remove("show");
      }, 4000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById('player');

      function addOverlayElements(plyrContainer) {
        // Watermark Logo
        if (!plyrContainer.querySelector('.watermark-logo')) {
          const logoDiv = document.createElement('div');
          logoDiv.className = 'watermark-logo';
          logoDiv.innerHTML = '<span class="prt">PRT</span> <span class="stream">STREAM</span>';
          plyrContainer.appendChild(logoDiv);
        }

        // Action Buttons
        if (!plyrContainer.querySelector('.action-btn-group')) {
          const btnGroup = document.createElement('div');
          btnGroup.className = 'action-btn-group';

          const openBtn = document.createElement('button');
          openBtn.id = 'prtOpenBtn';
          openBtn.className = 'prt-open-btn';
          openBtn.innerHTML = '<i class="fa-solid fa-circle-play"></i> OPEN IN APP';
          openBtn.onclick = handleAppRedirect;

          const installBtn = document.createElement('a');
          installBtn.id = 'installAppBtn';
          installBtn.className = 'install-app-btn';
          installBtn.href = 'https://prtstream.xyz';
          installBtn.target = '_blank';
          installBtn.innerHTML = '<i class="fa-solid fa-download"></i> INSTALL APP';

          btnGroup.appendChild(openBtn);
          btnGroup.appendChild(installBtn);
          plyrContainer.appendChild(btnGroup);
        }

        // Zoom Ratio Button
        const controls = plyrContainer.querySelector('.plyr__controls');
        if (controls && !controls.querySelector('.zoom-btn')) {
          const zoomBtn = document.createElement('button');
          zoomBtn.className = 'plyr__controls__item plyr__control zoom-btn';
          zoomBtn.innerText = 'FIT';
          
          const ratios = ['fit-contain', 'fit-cover', 'fit-fill'];
          const labels = ['FIT', 'CROP', 'FILL'];
          let currentIndex = 0;

          zoomBtn.addEventListener('click', () => {
            video.classList.remove(ratios[currentIndex]);
            currentIndex = (currentIndex + 1) % ratios.length;
            video.classList.add(ratios[currentIndex]);
            zoomBtn.innerText = labels[currentIndex];
          });

          controls.appendChild(zoomBtn);
        }

        // Inject Social Bar Ad inside Plyr element so it displays both normal and fullscreen
        if (!plyrContainer.querySelector('#ad-script-container')) {
          const adContainer = document.createElement('div');
          adContainer.id = 'ad-script-container';
          const adScript = document.createElement('script');
          adScript.setAttribute('data-cfasync', 'false');
          adScript.src = 'https://czernik.org/14/d9713a5f328e04d9a25ad04956045ad7';
          adContainer.appendChild(adScript);
          plyrContainer.appendChild(adContainer);
        }
      }

      const plyrControls = ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'speed', 'pip', 'quality', 'settings', 'fullscreen'];

      const plyrOptions = {
        controls: plyrControls,
        fullscreen: { enabled: true, fallback: true, iosNative: true },
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
      };

      if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
        const hls = new Hls({ maxMaxBufferLength: 100 });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          const availableLevels = hls.levels.map((l) => l.height).filter(Boolean);
          const defaultQuality = availableLevels.length ? availableLevels[0] : 0;

          plyrOptions.quality = {
            default: defaultQuality,
            options: availableLevels,
            forced: true,
            onChange: (newQuality) => {
              hls.levels.forEach((level, index) => {
                if (level.height === newQuality) {
                  hls.currentLevel = index;
                }
              });
            }
          };

          const player = new Plyr(video, plyrOptions);

          // Auto Landscape Orientation on Fullscreen Mode
          player.on('enterfullscreen', () => {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(() => {});
            }
          });

          player.on('exitfullscreen', () => {
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          });

          const plyrElement = document.querySelector('.plyr');
          if (plyrElement) addOverlayElements(plyrElement);

          video.play().catch(() => { 
            video.muted = true; 
            video.play(); 
          });
        });
      } else {
        video.src = streamUrl;
        const player = new Plyr(video, plyrOptions);

        player.on('enterfullscreen', () => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        });

        player.on('exitfullscreen', () => {
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        });
        
        const plyrElement = document.querySelector('.plyr');
        if (plyrElement) addOverlayElements(plyrElement);

        video.play().catch(() => { 
          video.muted = true; 
          video.play(); 
        });
      }
    });
  </script>
</body>
</html>
